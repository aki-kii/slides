<text x="26" y="100" font-family="'Fira Code', monospace" font-size="13" font-weight="normal" fill="#2c3e50" text-anchor="start">const&#160;sg&#160;=&#160;new&#160;ec2.SecurityGroup(this,&#160;'BastionSg',&#160;{</text>
<text x="26" y="119.5" font-family="'Fira Code', monospace" font-size="13" font-weight="normal" fill="#2c3e50" text-anchor="start">&#160;&#160;vpc,</text>
