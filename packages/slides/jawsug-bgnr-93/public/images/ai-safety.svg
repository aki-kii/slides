<text x="26" y="158.5" font-family="'Fira Code', monospace" font-size="13" font-weight="normal" fill="#2c3e50" text-anchor="start">});</text>
<text x="26" y="197.5" font-family="'Fira Code', monospace" font-size="13" font-weight="normal" fill="#DD344C" text-anchor="start">sg.addIngressRule(ec2.Peer.anyIpv4(),&#160;ec2.Port.tcp(22));</text>
